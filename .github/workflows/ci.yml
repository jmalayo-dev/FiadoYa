# CI/CD del backend (Plan §10.3): build + pruebas unitarias e integración, JaCoCo, validación de K8s
# y, solo en main, publicación de imágenes en GHCR con etiqueta de versión y SHA.
name: CI backend

on:
  push:
    branches: [main, "feat/**"]
  pull_request:

permissions:
  contents: read
  packages: write

env:
  VERSION: 1.0.0

jobs:
  verificar:
    name: Compilar y probar (mvn verify -Pit)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Pruebas unitarias y de integración (Testcontainers)
        run: ./mvnw -B -ntp -Pit verify
      - name: Reportes JaCoCo
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco
          path: "**/target/site/jacoco/"
          if-no-files-found: ignore

  manifiestos:
    name: Validar manifiestos de Kubernetes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: kustomize + kubeconform
        run: |
          cp deploy/k8s/secrets.env.example deploy/k8s/secrets.env
          kubectl kustomize deploy/k8s > manifiestos.yaml
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.7.0/kubeconform-linux-amd64.tar.gz | tar xz
          ./kubeconform -strict -summary -ignore-missing-schemas manifiestos.yaml
      - name: Validar docker compose
        run: |
          cp .env.example .env
          docker compose --env-file .env -f deploy/compose/docker-compose.basico.yml -f deploy/compose/docker-compose.completo.yml config --quiet

  imagenes:
    name: Publicar imágenes en GHCR
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [verificar, manifiestos]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        servicio: [config-server, discovery-server, api-gateway, auth-service, inventario-service,
                   clientes-fiado-service, ventas-service, notificaciones-service, reportes-service, distribuidora-soap]
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.servicio }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fiadoya-${{ matrix.servicio }}:${{ env.VERSION }}
            ghcr.io/${{ github.repository_owner }}/fiadoya-${{ matrix.servicio }}:${{ github.sha }}
            ghcr.io/${{ github.repository_owner }}/fiadoya-${{ matrix.servicio }}:latest
          cache-from: type=gha,scope=${{ matrix.servicio }}
          cache-to: type=gha,mode=max,scope=${{ matrix.servicio }}
