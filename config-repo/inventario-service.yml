server:
  port: 8082
fiadoya:
  db:
    nombre: fiadoya_inventario
  soap:
    url: ${SOAP_URL:http://localhost:8087/ws/distribuidora}
    timeout-ms: 5000
resilience4j:
  circuitbreaker:
    instances:
      distribuidora:
        sliding-window-size: 10
        minimum-number-of-calls: 4
        failure-rate-threshold: 50
        wait-duration-in-open-state: 20s
        permitted-number-of-calls-in-half-open-state: 2
  timelimiter:
    instances:
      distribuidora:
        timeout-duration: 6s
