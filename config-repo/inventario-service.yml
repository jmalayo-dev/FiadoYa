server:
  port: 8082
fiadoya:
  db:
    nombre: fiadoya_inventario
  soap:
    url: ${SOAP_URL:http://localhost:8087/ws/distribuidora}
    timeout-ms: 5000
spring:
  cloud:
    circuitbreaker:
      resilience4j:
        # El tiempo máximo lo controla el cliente SOAP (5 s); sin TimeLimiter extra.
        disable-time-limiter: true
