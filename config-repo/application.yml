# Configuración compartida por todos los servicios (la sirve config-server).
# Los valores sensibles llegan por variables de entorno (.env en Docker, Secret en Kubernetes).
server:
  shutdown: graceful

spring:
  threads:
    virtual:
      enabled: true
  jackson:
    default-property-inclusion: always
  datasource:
    url: jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${fiadoya.db.nombre};encrypt=true;trustServerCertificate=true
    username: ${DB_USER:fiadoya_app}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        default_batch_fetch_size: 50
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:fiadoya}
    password: ${RABBIT_PASSWORD:}
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 5s

eureka:
  client:
    enabled: ${EUREKA_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka}
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,circuitbreakers
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    rabbit:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
    export:
      zipkin:
        enabled: ${ZIPKIN_ENABLED:false}
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://localhost:9411/api/v2/spans}
  metrics:
    tags:
      application: ${spring.application.name}
  observations:
    key-values:
      application: ${spring.application.name}

springdoc:
  swagger-ui:
    path: /swagger-ui.html

fiadoya:
  # Circuit breakers (se aplican en código, ver ResilienciaConfig de cada servicio)
  circuitos:
    ventana: 10
    minimo-llamadas: 4
    porcentaje-fallos: 50
    segundos-abierto: 20
  security:
    jwt-secret: ${JWT_SECRET:}
    jwt-issuer: ${JWT_ISSUER:fiadoya-auth}
    internal-key: ${INTERNAL_API_KEY:}
  logstash:
    host: ${LOGSTASH_HOST:logstash}
    port: ${LOGSTASH_PORT:5000}

logging:
  pattern:
    correlation: "[${spring.application.name:},%X{traceId:-},%X{spanId:-}] "
