# Configuración no sensible común a los servicios (lo demás vive en config-repo, servido por config-server).
apiVersion: v1
kind: ConfigMap
metadata:
  name: fiadoya-config
data:
  SPRING_PROFILES_ACTIVE: kubernetes,demo
  CONFIG_SERVER_URL: http://config-server:8888
