  BODEGA_NOMBRE: Bodega Don Carlos
  BODEGA_TELEFONO: "987112233"
  BODEGA_DIRECCION: Jr. Áncash 412, Lima
  ZIPKIN_ENABLED: "false"
  JAVA_OPTS: -XX:MaxRAMPercentage=70 -XX:+UseSerialGC
