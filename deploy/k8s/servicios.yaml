apiVersion: v1
kind: Service
metadata:
  name: config-server
  labels: { app: config-server }
spec:
  selector: { app: config-server }
  ports:
    - { port: 8888, name: http }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: config-server
  labels: { app: config-server, parte-de: fiadoya }
spec:
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: config-server }
  template:
    metadata:
      labels: { app: config-server }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8888"
    spec:
      containers:
        - name: config-server
          image: fiadoya/config-server:local
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8888, name: http }]
          envFrom:
            - configMapRef: { name: fiadoya-config }
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 640Mi }
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8888 }
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8888 }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8888 }
            periodSeconds: 20
            failureThreshold: 3
---
